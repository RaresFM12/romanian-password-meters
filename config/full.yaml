scale: full

seeds:
  main: 20261111
  extra: [1, 2]
  real_sample: 0

categories:
  RO-word:       2000
  RO-word-num:   2000
  RO-word-year:  2000
  RO-name-num:   2000
  RO-name-sym:   1500
  RO-place:      1500
  RO-phrase:     2000
  RO-leet:       1500
  RO-translit:   1000
  RO-inflected:  1000
  RO-cultural:   1000
  RO-passphrase:  1000
  EN-word-num:   2000
  EN-name-num:   2000
  EN-phrase:     2000
  RANDOM:        2000
families:
  total: 1000
  with_st: 600
  with_circumflex: 200
  with_breve_i: 200
  min_strings: 4600

twins:
  - [RO-word-num, EN-word-num]
  - [RO-name-num, EN-name-num]
  - [RO-phrase,   EN-phrase]

open_class:
  [RO-word, RO-word-num, RO-word-year, RO-name-num, RO-name-sym,
   RO-phrase, RO-leet, RO-translit, RO-inflected, RO-passphrase]

generator:
  rank_bands: [[1, 100], [101, 1000], [1001, 10000], [10001, 50000]]
  case_style: {lower: 0.50, initial_upper: 0.40, all_upper: 0.10}
  year_range: [1950, 2026]
  digit_suffix:
    lengths: [1, 2, 3, 4]
    common_fraction: 0.5
    common: ["1","2","7","12","13","21","22","23","69","77","99",
             "00","01","007","100","111","123","321","666","1234"]
  symbols: ["!","@","#","$","%","&","*","?",".","_"]
  optional_part_prob: 0.5
  diacritic_shares: {ascii: 0.80, correct: 0.10, cedilla: 0.05, digraph: 0.05}
  leet:
    base_mix: {word: 0.3334, name: 0.3333, phrase: 0.3333}
    substitutions: {a: ["@","4"], e: ["3"], i: ["1","!"], o: ["0"], s: ["$","5"], t: ["7"]}
    per_char_prob: 0.5
    min_substitutions: 1
  passphrase:
    word_counts: [3, 4]
    joiners: ["", " "]
  random:
    charset_lo: 0x20
    charset_hi: 0x7E
    length_range: [8, 16]

reference:
  attackers_main: [A-EN, A-RO, A-ALL, A-JTR, A-PCFG]
  budgets:   {A-EN: 1.0e+10, A-RO: 1.0e+10, A-ALL: 1.0e+10, A-JTR: 1.0e+10, A-PCFG: 1.0e+9,
              A-RO-NOVAR: 1.0e+10}
  cut_variant: 1.0e+9
  smoke_budget: 1.0e+8
  run_budget: 1.0e+10

scoring:
  D: 10000
  # 1e3, 1e6, 1e8, 1e10, each + 5
  score_thresholds: [1005, 1000005, 100000005, 10000000005]
  weak_threshold: 1.0e+6
  weak_threshold_robust: [1.0e+4, 1.0e+8]
  min_weak_for_test: 100
  D_variants: [1000, 100, 10]
  reference_year: 2026

policy:
  normal: {min_len: 8, min_classes: 3}
  strict: {min_len: 12, min_classes: 4}

breach:
  split: {meter: 0.40, attacker: 0.30, validation: 0.30}
  seed: 42
  precision_sample: 300
  reuse_groups: [[1000, null], [100, 999], [10, 99], [2, 9], [1, 1]]

stats:
  bootstrap_resamples: 10000
  bootstrap_resamples_ci: 1000
  holm_alpha: 0.05
  tests_are: illustrative

meters:
  resource_groups: [norm, digraph, clean_words, names, places, cultural, leaked, matchers]
  czech:
    D_main: 10000
    D_secondary: 1000
    bundle_size_target_kb: 900
